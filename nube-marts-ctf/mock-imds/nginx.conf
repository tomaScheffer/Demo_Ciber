worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name 169.254.169.254;

        # Serve the fake IAM credentials at the exact IMDS path.
        location = /latest/meta-data/iam/security-credentials/role {
            default_type application/json;
            alias /usr/share/nginx/metadata/metadata.json;
        }

        # Convenience: list the role name, mimicking real IMDS behaviour.
        location = /latest/meta-data/iam/security-credentials/ {
            default_type text/plain;
            return 200 "role";
        }

        location / {
            default_type text/plain;
            return 200 "NubeMarts mock IMDS\n";
        }
    }
}
